[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-voice-agent"
version = "0.1.0"
description = "A local-first, low-latency, interruptible voice conversational agent"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "MIT" }
authors = [
    { name = "Vikas Tiwari", email = "vikast4843@gmail.com" }
]
keywords = [
    "voice-agent",
    "real-time",
    "speech-to-text",
    "text-to-speech",
    "vad",
    "llm",
    "low-latency",
    "barge-in"
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "onnxruntime>=1.17.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0.0",
]
tts = [
    "piper-tts>=1.2.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
all = [
    "local-voice-agent[stt,tts,server,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
